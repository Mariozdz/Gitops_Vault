server:
  image:
    repository: hashicorp/vault
    tag: "1.21.2"

  replicas: 2

  affinity: {}

  standalone:
    enabled: false

  ha:
    enabled: true
    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true

        listener "tcp" {
          address     = "0.0.0.0:8200"
          cluster_address = "0.0.0.0:8201"
          tls_disable = true
        }

        storage "raft" {
          path = "/vault/data"
        }

        api_addr = "http://vault.vault.svc:8200"
        service_registration "kubernetes" {}


  dataStorage:
    enabled: true
    size: 1Gi

ui:
  enabled: true