apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
  # annotations:
  #   argocd.argoproj.io/sync-wave: "5"
spec:
  project: default

  sources:
  - repoURL: https://charts.jetstack.io
    chart: trust-manager
    targetRevision: v0.21.1
    helm:
      releaseName: trust-manager
      valueFiles:
        - $values/apps/cert-manager/base/trust-manager-values.yaml

  - repoURL: https://github.com/Mariozdz/Gitops_Vault.git
    targetRevision: main
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true