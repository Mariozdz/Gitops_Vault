apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-bootstrap
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Mariozdz/Gitops_Vault.git
    targetRevision: main
    path: apps/vault/base

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true