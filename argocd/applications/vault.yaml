apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Mariozdz/Gitops_Vault.git
    targetRevision: main
    path: apps/vault/base
    helm:
      releaseName: vault
      valueFiles:
        - values.yaml
      chart: vault
      repoURL: https://helm.releases.hashicorp.com
      targetRevision: 0.32.0

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true