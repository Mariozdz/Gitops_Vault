apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  # annotations:
  #   argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  sources:
  - repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.26.1
    helm:
      releaseName: openbao
      valueFiles:
        - $values/argocd/chart-values/openbao/values.yaml

  - repoURL: https://github.com/Mariozdz/Gitops_Vault.git
    targetRevision: main
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true