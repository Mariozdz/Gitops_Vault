apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-client-test
  namespace: curl-app
spec:
  secretName: vault-client-test-tls
  issuerRef:
    kind: ClusterIssuer
    name: vault-ca-issuer
  commonName: curl-app
  dnsNames:
    - curl-app
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    size: 2048